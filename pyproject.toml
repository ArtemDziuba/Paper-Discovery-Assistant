[project]
name = "paper-discovery-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "pydantic>=2.10,<3", "httpx>=0.28,<1", "streamlit>=1.41,<2", "sentence-transformers>=3.4,<6", "scikit-learn>=1.6,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.optional-dependencies]
cuda = ["torch==2.9.1; sys_platform == 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

